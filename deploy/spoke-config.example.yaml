# cmd/acme-spoke config, for one spoke host. This binary generates its own
# key, drives its own ACME order, installs the resulting certificate
# locally, and runs its own local reload hook — it never sends the hub a
# private key, and never holds DNS provider credentials itself. See
# ARCHITECTURE.md for the full request flow.

hub_url: "https://192.0.2.10:8443"
hub_token: "${HUB_TOKEN}" # must match this spoke's token in the hub's config

# The hub's own certificate, copied here out-of-band (it's self-signed —
# see ARCHITECTURE.md "TLS" — so there's no certificate authority for this
# to chain to). This spoke trusts exactly this certificate and no other;
# verify it with `openssl x509 -in hub-cert.pem -noout -fingerprint -sha256`
# against what the hub logged on its own startup before trusting it. Plain
# `sha256sum` on this file will NOT match that fingerprint — it hashes the
# raw PEM file bytes, not the parsed certificate, which is a different value.
hub_tls_cert_file: /etc/acme-spoke/hub-cert.pem

poll_interval: 15m
request_timeout: 30s # bounds quick hub calls: due, checkin
dns01_timeout: 3m # bounds dns01 present/cleanup relay calls (the hub's DNS provider can be slow, e.g. Route53's ~2min propagation wait)
retry_backoff: 1h # local backoff after a failed issuance attempt, doubling each consecutive failure
max_retry_backoff: 24h
hook_timeout: 30s

# Leave false unless this host's network can't make direct outbound DNS
# queries to arbitrary authoritative nameservers (e.g. a firewall that only
# permits DNS through a specific resolver). When true, lego's own
# client-side propagation pre-check is skipped and Let's Encrypt's servers
# do the real authoritative check instead.
skip_propagation_check: false

acme:
  environment: staging # staging | production — Let's Encrypt only. Mutually exclusive with directory_url below; set exactly one.
  email: admin@example.com # optional — RFC 8555's contact field isn't required to register; omit to skip it entirely

  # Optional: point at any ACME-compliant CA instead of Let's Encrypt (public
  # or private — e.g. a self-hosted step-ca). Mutually exclusive with
  # environment above.
  # directory_url: "https://ca.example.com/acme/directory"

  # Optional: trust a private CA's own TLS certificate on its ACME API
  # endpoint. A different trust relationship than the certificates this
  # spoke requests from that CA — a public CA's API endpoint is already
  # covered by the OS trust store; a private CA's usually isn't. Only
  # meaningful alongside directory_url.
  # ca_cert_file: /etc/acme-spoke/private-ca.pem

  # Optional: External Account Binding (RFC 8555 §7.3.4), required by some
  # CAs — both private CA setups and some public ones (e.g. Google Trust
  # Services) — to gate account registration. Both issued by the CA out of
  # band; must be set together or not at all.
  # eab_key_id: "${ACME_EAB_KEY_ID}"
  # eab_hmac_key: "${ACME_EAB_HMAC_KEY}"

data_dir: /var/lib/acme-spoke
# db_path: /var/lib/acme-spoke/acme-spoke.db  # optional; defaults under data_dir

# Each cert is installed under <data_dir>/certs/<name>/current/
# {privkey.pem,cert.pem,fullchain.pem} — reload_hook (and whatever config
# file points your actual service at these certs, e.g. FreeRADIUS's
# eap.conf or nginx's ssl_certificate directive) should point there, not
# at <data_dir>/certs/<name>/ directly. See ARCHITECTURE.md "Certificate
# installation" for why "current" is a symlink on Unix (an NTFS junction
# on Windows) rather than the files living there directly.
certs:
  - name: radius-cert # must match this cert's name in the hub's spokes.<this-spoke>.certs config
    domains: [radius.example.com]
    reload_hook: "systemctl restart freeradius"

  # reload_hook isn't limited to a single command - it's the whole string
  # handed to sh -c (or cmd.exe /C on Windows), so a multi-step sequence
  # works exactly as you'd run it by hand. Some services genuinely need
  # this: FileMaker Server, for example, requires running fmsadmin to
  # import the new certificate before restarting the service - a plain
  # "restart" alone does nothing without that import step first.
  # - name: filemaker-cert
  #   domains: [filemaker.example.com]
  #   reload_hook: >-
  #     fmsadmin certificate import /var/lib/acme-spoke/certs/filemaker-cert/current/fullchain.pem
  #     --keyfile /var/lib/acme-spoke/certs/filemaker-cert/current/privkey.pem -y &&
  #     systemctl restart fmshelperd
  #   # hook_timeout overrides the spoke-wide default above for this cert
  #   # alone - a full service restart like this one can easily take
  #   # longer than a plain "reload" elsewhere on the same spoke, and
  #   # raising the global default just for this one cert would be
  #   # unnecessarily generous for every other reload_hook this spoke runs.
  #   hook_timeout: 2m
