# cmd/acme-hub config. The hub never holds a private key or an issued
# certificate — it tracks what spokes report, decides when they're due for
# renewal, and relays DNS-01 challenges to the DNS providers it holds
# credentials for. See ARCHITECTURE.md for the full request flow.

listen_addr: "192.0.2.10:8443" # prefer a private/internal interface where your network allows it; TLS + the per-spoke bearer token are the real security boundary either way
data_dir: /var/lib/acme-hub
# db_path: /var/lib/acme-hub/acme-hub.db  # optional; defaults under data_dir

# Optional: both default under data_dir/tls/. If no certificate exists at
# that path yet, one is self-signed on first startup (see ARCHITECTURE.md
# "TLS" and internal/selfsigned) — there's usually no reason to set these.
# Every spoke must be given a copy of the resulting certificate to trust
# (see deploy/spoke-config.example.yaml's hub_tls_cert_file); the hub logs
# its SHA-256 fingerprint on every startup so you can verify the copy.
# tls_cert_file: /var/lib/acme-hub/tls/cert.pem
# tls_key_file: /var/lib/acme-hub/tls/key.pem

# Optional; only needed when listen_addr is a wildcard bind (e.g.
# "0.0.0.0:8443") rather than one specific dialable interface. The
# self-signed cert's identity comes from listen_addr's host by default,
# which is wrong for a wildcard bind — spokes dial one real address, not
# "0.0.0.0", so set that real address (hostname or IP) here instead.
# tls_host: hub.example.com

acme_defaults:
  renew_before: 720h # renew when a spoke's reported cert has <30 days left, unless overridden per-cert below
  renewal_jitter: 48h # spreads renewals across a window instead of every cert converging on the same moment (see ARCHITECTURE.md "Renewal jitter"); only ever renews earlier than renew_before, never later

# Optional: fires when a certificate's status transitions to "failed"
# (alert) or from "failed" back to "active" (resolved) - not on every
# checkin. See ARCHITECTURE.md "Admin notifications" for the full list of
# environment variables passed to this command (ACME_SPOKE, ACME_CERT,
# ACME_STATUS, ACME_PREVIOUS_STATUS, ACME_ERROR, ACME_NOT_AFTER).
# notify_hook: "/etc/acme-hub/notify.sh"
notify_timeout: 30s

# Optional. How long a configured certificate can go without a checkin
# before notify_hook fires - the case a "failed" checkin alone can't
# catch: a spoke that can't reach the hub at all has no way to report
# that. See ARCHITECTURE.md "Hub-side staleness watchdog". Defaults to
# 2h, comfortably longer than the spoke's own default 15-minute
# poll_interval.
# watchdog_stale_after: 2h

# Optional. How long a claimed renewal lease lasts before it self-expires
# - the mechanism that stops two overlapping attempts for the same
# certificate from both proceeding at once (e.g. two processes of one
# spoke running concurrently after a botched restart). See
# ARCHITECTURE.md "Renewal lease/claim". Defaults to 15m, comfortably
# longer than a real issue/renew cycle but short enough that a genuinely
# crashed spoke doesn't block retries for long.
# renewal_lease_duration: 15m

# Optional. Bounds a single DNS-01 present/cleanup relay call to the real
# DNS provider before the hub gives up and returns an error to the
# requesting spoke — see ARCHITECTURE.md "Hub network hardening". Defaults
# to 3m, matching the spoke's own dns01_timeout default.
# dns_provider_timeout: 3m

# Optional. Set to enable GET /v1/status, a read-only, fleet-wide view of
# every certificate's renewal health (status, failure streak, last
# success, expiry) - see ARCHITECTURE.md "Status/dashboard API". A
# separate credential from any spoke's own token, deliberately: a spoke's
# token only ever authorizes it for its own certificates, which would
# defeat the point of a fleet-wide view. Also gates the full web admin UI
# at GET /admin (HTTP Basic Auth, username ignored, this token as the
# password) - add/remove spokes, tokens, certificates, and DNS providers,
# not just view status - see ARCHITECTURE.md "Web admin UI". Left unset,
# none of these endpoints exist at all.
# status_token: "${STATUS_TOKEN}"

# DNS providers and spokes are NOT configured in this file - they're
# managed through the hub's own database (internal/hubstore), via the web
# admin UI at GET /admin (gated by status_token above) or the
# cmd/acme-onboard / acme-hub --generate-token CLI tools. See
# ARCHITECTURE.md "Database-backed desired state" for why, and
# acme-hub --import-config if you're migrating a config.yaml from before
# this change that still has spokes:/dns_providers: sections.
