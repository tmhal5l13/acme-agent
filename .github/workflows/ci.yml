name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "the following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    name: Pebble end-to-end ACME tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install pebble and pebble-challtestsrv
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@latest
          go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # internal/acmeclient and internal/hubapi each launch their own pebble
      # + pebble-challtestsrv subprocesses on fixed ports - -p 1 forces them
      # to run one package's test binary at a time instead of go test's
      # default per-package parallelism, or the two packages' pebble
      # instances collide on the same ports. See pebble_test.go's doc
      # comment in both packages for the full reasoning.
      - name: Run Pebble e2e tests
        env:
          ACME_AGENT_E2E_TESTS: "1"
        run: go test -p 1 ./internal/acmeclient/... ./internal/hubapi/... -run Pebble -v

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Build-only, no test run: there's no macOS runner here to execute
      # the resulting binary on, and this project has no cgo, so a clean
      # `go build` is what actually would have caught the
      # syscall.Umask-on-Windows bug internal/umask fixes - catching a
      # future regression like it here, automatically, rather than only
      # when someone happens to try a cross-compile by hand. Windows gets
      # real test execution too, on a real windows-latest runner - see the
      # test-windows job below; this job still cross-compiles it from
      # Linux alongside darwin/arm64, since a build-only check on every
      # push is cheap and catches a compile break faster than waiting for
      # test-windows' longer-running job to fail the same way.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o /dev/null ./cmd/acme-hub
          go build -o /dev/null ./cmd/acme-spoke
          go build -o /dev/null ./cmd/acme-onboard

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Scoped to the packages touched by "genuine Windows spoke support"
      # (internal/hook's OS-native shell, internal/secureperm's Windows
      # ACLs, internal/certwriter's junction-based atomic swap,
      # internal/winservice's SCM integration, and their spoke-side
      # callers) rather than a full ./... - cmd/acme-hub's own test suite
      # has a pre-existing Unix-only assumption (syscall.Kill in
      # main_test.go) that's out of scope here: the hub stays a Linux-only
      # deployment target (see ARCHITECTURE.md's "Cross-platform builds"),
      # only the spoke needed to actually work on Windows.
      - name: Test
        run: go test ./internal/hook/... ./internal/secureperm/... ./internal/certwriter/... ./internal/store/... ./internal/winservice/... ./cmd/acme-spoke/...

      - name: Test (race detector)
        run: go test -race ./internal/hook/... ./internal/secureperm/... ./internal/certwriter/... ./internal/store/... ./internal/winservice/... ./cmd/acme-spoke/...
